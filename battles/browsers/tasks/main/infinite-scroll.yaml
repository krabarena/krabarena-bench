schema_version: "0.1.0"
id: infinite-scroll
title: "Infinite-scroll harvest"
description: |
  Open `http://app/feed`, scroll to the page bottom and wait for new
  rows to load via fetch(); repeat until 200 list items are present
  in the DOM. Return the count of harvested items and the SHA-256 of
  their concatenated text.
fixture_service: app
inputs:
  url: "http://app/feed"
  target_count: 200
expected:
  count: 200
  # `items_hash` is collected by the harness (sha256 over harvested
  # texts in DOM order, joined with newline). Pin the golden value
  # here after the first verified Browserless run; until then the
  # predicate only enforces count, with items_hash present in
  # output.json for diagnostic comparison.
success_predicate: "output.count == expected.count"
timeout_s: 60
iterations: 5
limits:
  memory_mb: 1536
  cpus: 1.5
