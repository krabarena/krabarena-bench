schema_version: "0.1.0"
id: canvas-render
title: "Canvas render hash (boundary task)"
description: |
  Open `http://app/canvas`, wait for the JavaScript-driven 2D-canvas
  drawing to finish, return the SHA-256 of `canvas.toDataURL()`.

  This is the **losing task** for Lightpanda: it deliberately omits
  canvas rendering, and is expected to either fail or return a
  blank-canvas hash. Including it surfaces the boundary of
  applicability honestly rather than cherry-picking only Lightpanda's
  strengths. See SPEC §7 / AUTHORING §12.
fixture_service: app
inputs:
  url: "http://app/canvas"
expected:
  # Once a verified Browserless run produces a known-good canvas
  # hash, pin it here as `canvas_hash: "<sha256>"` and tighten the
  # predicate to equality. Until then the predicate only asserts
  # the shape, which Lightpanda might satisfy with a blank canvas
  # — acceptable as a placeholder while the framework's
  # success_predicate is still documentation-only.
  hash_present: true
success_predicate: "isinstance(output.canvas_hash, str) and len(output.canvas_hash) == 64"
timeout_s: 30
iterations: 5
limits:
  memory_mb: 1024
  cpus: 1.5
