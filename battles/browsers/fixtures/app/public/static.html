<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>krabarena fixture / static</title>
</head>
<body>
  <h1>Static SPA</h1>
  <ul id="items"></ul>
  <script>
    // Render 50 items synchronously into the DOM.
    const ul = document.getElementById("items");
    for (let i = 0; i < 50; i++) {
      const li = document.createElement("li");
      li.textContent = "static-item-" + i.toString().padStart(3, "0");
      ul.appendChild(li);
    }
    // Mark the page as ready for harness probes.
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
