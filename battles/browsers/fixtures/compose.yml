# Local fixtures for the browsers Battle.
# Egress-blocked: every service sits on the `bench` internal network.

services:
  browserless:
    image: ghcr.io/browserless/chromium@sha256:78afaada9f7b049783bfed624e6b5e9a2d3438fc04bb46801ed777e82ae1501f
    networks: [bench]
    environment:
      TOKEN: krabarena
      CONCURRENT: "16"
    healthcheck:
      # `/json/version` requires the token in v2; without it the server
      # returns 401 and the healthcheck fails forever. 127.0.0.1 (not
      # localhost) avoids the IPv6 fallback issue that bites alpine wget.
      test:
        - "CMD-SHELL"
        - "wget -q --tries=1 -O - 'http://127.0.0.1:3000/json/version?token=krabarena' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s  # Browserless boots a real Chromium; spare the noise during boot.

  lightpanda:
    image: lightpanda/browser@sha256:0283ba962dffe2f7b46a29377276837b033b1174b92b5a30da641a1b1561ef5c
    networks: [bench]
    # Default CMD is `/bin/lightpanda serve --host 0.0.0.0 --port 9222
    # --log_level info`. We re-issue it (with the absolute path —
    # without it the override exits 127) and add `--advertise-host
    # lightpanda` so Playwright's `connectOverCDP` gets a routable
    # WebSocket URL. Without that flag Lightpanda advertises
    # `ws://0.0.0.0:9222/...` to the client; Playwright connects to
    # 0.0.0.0 literally, which from inside the harness container is
    # itself (ECONNREFUSED), and every iteration fails.
    command:
      - "/bin/lightpanda"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--advertise-host"
      - "lightpanda"
      - "--log_level"
      - "info"
    healthcheck:
      # The lightpanda image has no wget / curl / nc, but it does have
      # bash with /dev/tcp support — that's enough to verify the CDP
      # port is accepting connections without HTTP-level probing.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  headless-shell:
    # chromedp/headless-shell — raw upstream Chromium with
    # --remote-debugging-port=9223 (chrome) bridged to :9222 via
    # socat in the image's own ENTRYPOINT. No service-layer wrapper.
    # The "control" experiment: shows how much overhead Browserless's
    # session-management layer adds vs unwrapped headless Chrome.
    # Multi-arch manifest list digest (linux/amd64 + linux/arm64).
    #
    # IMPORTANT: do NOT pass `--remote-debugging-port=9222` here. The
    # image's ENTRYPOINT already does `socat 9222→127.0.0.1:9223` and
    # launches chrome on :9223. Overriding the port flag double-binds
    # 9222 and the inner chrome falls back to IPv6-only on ::1,
    # leaving socat with nothing to route. Trust the image default.
    image: chromedp/headless-shell@sha256:313ed7255ae1e155fb157631a6d4c0eb8b65bbe06de9e704ed834399bdf678ff
    networks: [bench]
    healthcheck:
      # chromedp/headless-shell ships bash + socat but NOT wget/curl,
      # so we probe at the TCP layer via bash's /dev/tcp — same trick
      # the lightpanda service uses. Sufficient to confirm socat is
      # bridging 9222 → inner chrome on :9223.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: ./app
    networks: [bench]
    healthcheck:
      # 127.0.0.1, not localhost — alpine's wget tries ::1 first and
      # the Node Express server only binds IPv4 (`0.0.0.0`).
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10

networks:
  bench:
    internal: true
