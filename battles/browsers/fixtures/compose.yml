# Local fixtures for the browsers Battle.
# Egress-blocked: every service sits on the `bench` internal network.

services:
  browserless:
    image: ghcr.io/browserless/chromium@sha256:78afaada9f7b049783bfed624e6b5e9a2d3438fc04bb46801ed777e82ae1501f
    networks: [bench]
    environment:
      TOKEN: krabarena
      CONCURRENT: "16"
    healthcheck:
      # `/json/version` requires the token in v2; without it the server
      # returns 401 and the healthcheck fails forever. 127.0.0.1 (not
      # localhost) avoids the IPv6 fallback issue that bites alpine wget.
      test:
        - "CMD-SHELL"
        - "wget -q --tries=1 -O - 'http://127.0.0.1:3000/json/version?token=krabarena' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s  # Browserless boots a real Chromium; spare the noise during boot.

  lightpanda:
    image: lightpanda/browser@sha256:0283ba962dffe2f7b46a29377276837b033b1174b92b5a30da641a1b1561ef5c
    networks: [bench]
    # Default CMD is `/bin/lightpanda serve --host 0.0.0.0 --port 9222
    # --log_level info`. We re-issue it (with the absolute path —
    # without it the override exits 127) and add `--advertise-host
    # lightpanda` so Playwright's `connectOverCDP` gets a routable
    # WebSocket URL. Without that flag Lightpanda advertises
    # `ws://0.0.0.0:9222/...` to the client; Playwright connects to
    # 0.0.0.0 literally, which from inside the harness container is
    # itself (ECONNREFUSED), and every iteration fails.
    command:
      - "/bin/lightpanda"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9222"
      - "--advertise-host"
      - "lightpanda"
      - "--log_level"
      - "info"
    healthcheck:
      # The lightpanda image has no wget / curl / nc, but it does have
      # bash with /dev/tcp support — that's enough to verify the CDP
      # port is accepting connections without HTTP-level probing.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  chrome-internal:
    # chromedp/headless-shell — raw upstream Chromium with
    # --remote-debugging-port=9223 (chrome) bridged to :9222 via
    # socat in the image's own ENTRYPOINT. The "control" experiment:
    # shows how much overhead Browserless's session-management layer
    # adds vs unwrapped headless Chrome.
    #
    # Reachable only as `chrome-internal:9222`. The `headless-shell`
    # service below is an nginx Host-rewrite front-door because raw
    # Chrome's DNS-rebinding protection refuses requests whose Host
    # header isn't an IP or "localhost" — Playwright sends
    # `Host: chrome-internal:9222` on both HTTP and WS upgrades and
    # Chrome returns 500 "Host header is specified and is not an IP
    # address or localhost". The nginx layer rewrites Host → localhost
    # so Chrome accepts. See battles/browsers/fixtures/nginx.conf.
    image: chromedp/headless-shell@sha256:313ed7255ae1e155fb157631a6d4c0eb8b65bbe06de9e704ed834399bdf678ff
    networks: [bench]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  headless-shell:
    # nginx front-door for chrome-internal. Rewrites the Host header
    # to localhost:9222 on every request (HTTP and WS) so raw Chrome's
    # DNS-rebinding protection passes. WebSocket upgrade is preserved
    # via standard Upgrade/Connection proxying.
    #
    # Pinned to a specific multi-arch manifest digest so the same
    # bytes run for claimer + verifier.
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    networks: [bench]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      chrome-internal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:9222/json/version || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  app:
    build: ./app
    networks: [bench]
    healthcheck:
      # 127.0.0.1, not localhost — alpine's wget tries ::1 first and
      # the Node Express server only binds IPv4 (`0.0.0.0`).
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10

networks:
  bench:
    internal: true
