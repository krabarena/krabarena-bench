# Host-rewrite reverse proxy for chromedp/headless-shell.
#
# Raw Chrome's CDP server enforces a DNS-rebinding protection: any
# request whose Host header isn't an IP address or "localhost" is
# refused with HTTP 500. Inside the Compose bench network the harness
# can only reach chrome-internal by its service hostname, so the
# Host header would be `chrome-internal:9222` (or `headless-shell:9222`
# from the front-door) and Chrome would reject it.
#
# This nginx server listens on :9222 and proxies every request to
# `chrome-internal:9222` with the Host header rewritten to
# `localhost:9222`, which Chrome accepts. WebSocket upgrade is
# preserved with the standard Upgrade/Connection forwarding so
# `connectOverCDP` can complete the WS handshake against this proxy.

worker_processes 1;
events { worker_connections 1024; }

http {
  upstream chrome { server chrome-internal:9222; }

  server {
    listen 9222;

    location / {
      proxy_pass http://chrome;
      # The whole point: rewrite Host so Chrome's DNS-rebinding check
      # passes. `localhost:9222` mirrors what Chrome expects from a
      # same-host debugger client.
      proxy_set_header Host localhost:9222;

      # WebSocket upgrade — required by /devtools/browser/<id>.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # CDP sessions can be long-lived (whole-task bench runs); keep
      # the connection open well past any reasonable task timeout.
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;

      # /json/version responses include `webSocketDebuggerUrl` built
      # from the (rewritten) Host header, so they come back saying
      # `ws://localhost:9222/devtools/browser/<id>`. Playwright would
      # then connect to that literal URL — `localhost` from inside the
      # harness container is the harness itself, ECONNREFUSED. Rewrite
      # the response body so the WS URL points back at this proxy.
      sub_filter "ws://localhost:9222" "ws://headless-shell:9222";
      sub_filter_once off;
      sub_filter_types application/json;
    }
  }
}
