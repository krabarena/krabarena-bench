name: Smoke battles/browsers

# End-to-end smoke for the canonical browsers Battle: pulls the
# harness image from GHCR, brings up the Compose fixtures, runs the
# 7 tasks against browserless, asserts every run succeeded, uploads
# results as a debug artefact.
#
# Triggered on push to main and manual dispatch only — not on PRs —
# because the job is slow (~5-10 min) due to Docker image pulls and
# Compose orchestration. Run it from a branch with workflow_dispatch
# when you want to verify a change pre-merge.

on:
  push:
    branches: [main]
    paths:
      - "battles/browsers/**"
      - "bench-kit/**"
      - ".github/workflows/smoke-battles-browsers.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: bench run --tools browserless (all 7 tasks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench-kit/pyproject.toml

      - name: Install bench-kit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./bench-kit

      - name: Login to GHCR (for the harness image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker daemon
        run: docker info --format '{{.ServerVersion}}'

      - name: Validate Battle
        run: bench validate battles/browsers

      - name: Run Battle (browserless only — Lightpanda has known partial coverage)
        run: bench run battles/browsers --tools browserless

      - name: Assert every browserless iteration succeeded
        run: |
          python3 - <<'PY'
          import json, sys
          path = "battles/browsers/results/result.json"
          data = json.load(open(path, encoding="utf-8"))
          fails = [r for r in data["runs"] if not r["success"]]
          total = len(data["runs"])
          if fails:
              print(f"FAIL: {len(fails)} of {total} runs failed", file=sys.stderr)
              for r in fails:
                  print(f"  {r['tool']}/{r['task']}/iter{r['iteration']}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {total} runs all succeeded")
          PY

      - name: Upload result.json + per-iteration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.sha }}
          path: battles/browsers/results/
          retention-days: 14
